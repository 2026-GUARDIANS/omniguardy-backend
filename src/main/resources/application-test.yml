spring:
  datasource:
    url: jdbc:mysql://localhost:3306/omniguardy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: team3
    password: omniguardy_pw

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8080

jwt:
  secret-key: omniguardy-secret-key-should-be-at-least-32-bytes
  access-token-expire-time: 1800000
  refresh-token-expire-time: 1209600000

mqtt:
  broker-url: tcp://localhost:1883
  client-id: omniguardy-backend-test
  topic:
    tts: door/tts
    camera: door/camera

app:
  base-url: http://localhost:8080
  tts:
    audio-dir: ./_vol/tts/audio
    audio-url-prefix: /audio/tts

ai:
  agent:
    enabled: false
    openai:
      api-key: ""
      model-name: gpt-5-mini
      timeout-seconds: 60

  fastapi:
    vision:
      base-url: http://localhost:8000
      endpoint: /analyze/vision
      connect-timeout-seconds: 5
      read-timeout-seconds: 30
    audio:
      base-url: http://localhost:8001
      endpoint: /predict
