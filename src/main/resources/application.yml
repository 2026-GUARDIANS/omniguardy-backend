spring:
  profiles:
    active: dev # OR prod
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

omniguardy:
  device:
    api-key: ${AUDIO_DEVICE_API_KEY:}
  vision:
    callback:
      # Production Compose requires this explicitly; it is separate from the device/JWT keys.
      api-key: ${VISION_CALLBACK_API_KEY:}
  # Enabled workers resume eligible persisted jobs, including work created before deployment.
  # Production activation/backlog audit: deploy/STREAMING.md.
  streaming-agent:
    enabled: ${STREAMING_AGENT_ENABLED:true}
    preparation-lease: ${STREAMING_AGENT_PREPARATION_LEASE:30s}
    calling-lease: ${STREAMING_AGENT_CALLING_LEASE:5m}
    retry-delay: ${STREAMING_AGENT_RETRY_DELAY:10s}
    max-attempts: ${STREAMING_AGENT_MAX_ATTEMPTS:3}
    batch-size: ${STREAMING_AGENT_BATCH_SIZE:10}
    scheduler-delay-ms: ${STREAMING_AGENT_SCHEDULER_DELAY_MS:1000}
  streaming-video:
    upload-lease: ${STREAMING_VIDEO_UPLOAD_LEASE:5m}
    event-link-enabled: ${STREAMING_VIDEO_EVENT_LINK_ENABLED:true}
    event-link-delay-ms: ${STREAMING_VIDEO_EVENT_LINK_DELAY_MS:30000}
    event-link-batch-size: ${STREAMING_VIDEO_EVENT_LINK_BATCH_SIZE:100}
  vision-fallback:
    enabled: ${VISION_FALLBACK_ENABLED:true}
    retry-delay: ${VISION_FALLBACK_RETRY_DELAY:10s}
    video-wait: ${VISION_FALLBACK_VIDEO_WAIT:10m}
    vision-lease: ${VISION_FALLBACK_VISION_LEASE:5m}
    agent-lease: ${VISION_FALLBACK_AGENT_LEASE:5m}
    max-vision-attempts: ${VISION_FALLBACK_MAX_VISION_ATTEMPTS:3}
    max-preparation-attempts: ${VISION_FALLBACK_MAX_PREPARATION_ATTEMPTS:3}
    batch-size: ${VISION_FALLBACK_BATCH_SIZE:10}
    scheduler-delay-ms: ${VISION_FALLBACK_SCHEDULER_DELAY_MS:1000}

ai:
  fastapi:
    streaming-vision:
      # Development default only. Production Compose requires an EC2-reachable origin.
      base-url: ${STREAMING_VISION_BASE_URL:http://localhost:8010}
      polling-enabled: ${STREAMING_VISION_POLLING_ENABLED:true}
      poll-interval: ${STREAMING_VISION_POLL_INTERVAL:2s}
      max-wait: ${STREAMING_VISION_MAX_WAIT:5m}
      connect-timeout: ${STREAMING_VISION_CONNECT_TIMEOUT:2s}
      read-timeout: ${STREAMING_VISION_READ_TIMEOUT:5s}
      lease-duration: ${STREAMING_VISION_LEASE_DURATION:30s}
      batch-size: ${STREAMING_VISION_BATCH_SIZE:10}
      scheduler-delay-ms: ${STREAMING_VISION_SCHEDULER_DELAY_MS:1000}
